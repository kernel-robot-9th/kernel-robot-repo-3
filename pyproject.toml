[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-robot-control"
version = "0.1.0"
description = "Mock-first shopping robot orchestration; physical interfaces unverified"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["server*", "robot_gateway*", "robots*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
